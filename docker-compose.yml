services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentswitch
      POSTGRES_USER: paymentswitch
      POSTGRES_PASSWORD: paymentswitch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentswitch"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paymentswitch
      SPRING_DATASOURCE_USERNAME: paymentswitch
      SPRING_DATASOURCE_PASSWORD: paymentswitch
    ports:
      - "8080:8080"
